<!doctype html><html lang=ko><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>잇다 · 버스 이동 동행</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf0ff;color:#141d36;font:17px system-ui}#app{max-width:490px;margin:auto;background:#f6f8fd;min-height:100dvh;display:flex;flex-direction:column}header{padding:32px 23px 44px;background:radial-gradient(ellipse at 100% 0,#658aff,transparent 65%),#2447ed;color:white;border-radius:0 0 28px 28px}header small{letter-spacing:.15em}h1{margin:8px 0;font-size:34px}h2{font-size:22px;margin:0 0 12px}p{line-height:1.6;margin:8px 0 14px}main{padding:16px;flex:1}section{background:white;border:1px solid #e4eaff;border-radius:19px;padding:17px;margin-bottom:13px;box-shadow:0 5px 16px #2035830b}button,input,select{font:inherit;border-radius:12px;padding:11px;min-height:46px}button{border:0;background:#edf2ff;color:#203ca9;font-weight:700;cursor:pointer;margin:3px 4px 3px 0}button:focus-visible,input:focus-visible{outline:3px solid #ff9b35}input,select{border:1px solid #bac8eb;width:100%;background:white;margin:4px 0}button.primary{background:#2447ed;color:white;width:100%}nav{position:sticky;bottom:0;background:white;border-top:1px solid #dbe4ff;display:flex;justify-content:space-around;padding:7px}nav button{font-size:14px;background:white}nav button[aria-current=page]{background:#eaf0ff}.tag{font-size:13px;background:#e9efff;color:#203ca9;border-radius:20px;padding:5px 9px}.map{height:142px;width:100%;border-radius:13px;background:#e8f2ff}label{display:block;margin-top:8px}.check{width:auto;min-height:auto}.muted{color:#4b5875;font-size:14px}#notice{padding:0 18px;color:#263e9c}a{color:#233fc5}body{background:#eef2f9;color:#172139;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif}#app{background:#f6f8fc}header{margin:14px 14px 0;border-radius:32px;padding:23px 25px 26px;background:radial-gradient(ellipse at 95% 0,#629aff,transparent 70%),linear-g e='currentColor' stroke-width='1.8' stroke-linejoin='round' aria-hidden='true'><path d='m10 2-.7 3-2 .9-2.8-1.1-2 3.5 2.2 2-.1 2.4-2.2 2 2 3.5 2.9-1.1 2 .9.7 3h4l.7-3 2-.9 2.9 1.1 2-3.5-2.2-2-.1-2.4 2.2-2-2-3.5-2.8 1.1-2-.9-.7-3z'/><circle cx='12' cy='11.7' r='3'/></svg></button><small>ITDA &nbsp; / &nbsp; BUS COMPANION</small><h1>잇다</h1><div>화면을 보지 않아도 이어지는 이동</div></header><main id=m></main><div id=notice role=status></div><nav id=n aria-label='하단 메뉴'></nav></div><script>
const $=id=>document.getElementById(id), m=$('m');
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('itda.blue.'+k))??d}catch{return d}};
function save(k,v){try{localStorage.setItem('itda.blue.'+k,JSON.stringify(v));return true}catch{msg('이 브라우저에서는 기록을 저장할 수 없어요.');return false}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let places=read('places',['춘천시청','후평동 복지관','가까운 약국']), trip=read('trip',null), prefs=read('prefs',{voice:true,vibe:true,auto:true}), history=read('history',[]), reports=read('reports',[]), profile=read('profile',''), page=read('intro',false)?'홈':'시작', draft='', timer, note='', notice='';
const steps=['정류장 대기','탑승 확인','버스 이동','하차 준비','도착 확인'];
const action=(t,a,p=false)=>`<button type=button ${p?'class=primary':''} data-action='${a}'>${t}</button>`;
const card=(h,b)=>`<section><h2>${h}</h2>${b}</section>`;
function msg(s){notice=s;$('notice').textContent=s}
function say(text){if(prefs.voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}
function mic(fn,button){if(button?.getAttribute('aria-pressed')==='true')return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;const status=active=>{if(button?.isConnected){button.setAttribute('aria-pressed',String(active));$('voice-label').textContent=active?'듣고 있어요':'음성 검색'}};if(!R)return msg('이 브라우저는 음성 입력을 지원하지 않아요. 직접 입력해 주세요.');let handled=false;try{const r=new R;r.lang='ko-KR';r.onresult=e=>{handled=true;fn(e.results[0][0].transcript)};r.onerror=()=>{handled=true;status(false);msg('음성을 인식하지 못했어요. 마이크 권한을 확인하거나 직접 입력해 주세요.')};r.onend=()=>{status(false);if(!handled&&(!button||button.isConnected))msg('목적지를 다시 말하거나 직접 입력해 주세요.')};r.start();status(true);msg('듣고 있어요. 말씀해 주세요.')}catch{status(false);msg('마이크를 열 수 없어요. 직접 입력해 주세요.')}}
const map=`<svg class=map viewBox='0 0 410 142' role=img aria-label='시연용 경로 그림, 실제 지도 아님'><rect width='410' height='142' fill='#e8f2ff'/><path d='M0 44H410M0 112H410M80 0v142M280 0v142M340 0v142' stroke='white' stroke-width='12'/><path d='M0 120Q90 140 160 85T410 40' fill='none' stroke='#acd7fc' stroke-width='22'/><path d='M42 100h105V53h178' fill='none' stroke='#2447ed' stroke-width='7' stroke-linecap='round'/><g fill='white' stroke='#2447ed' stroke-width='5'><circle cx='42' cy='100' r='8'/><circle cx='147' cy='53' r='8'/><circle cx='325' cy='53' r='10'/></g></svg>`;
function guide(){if(!trip)return '진행 중인 이동이 없어요.';if(note)return note;return ['시연입니다. 버스가 세 정거장 뒤에 있어요.','시연 버스가 도착했어요. 버스 번호와 방향을 확인한 뒤, 탔는지 알려 주세요.','버스로 이동 중이에요. 시연에서는 목적지까지 세 정거장이 남았어요.','시연 목적지까지 두 정거장 남았어요. 손잡이를 잡고 하차를 준비하세요.','시연 목적지에 도착했어요. 안전하게 내렸는지 확인해 주세요.'][trip.step]}
function schedule(){clearTimeout(timer);if(page==='이동'&&prefs.auto&&trip&&!note&&[0,2,3].includes(trip.step))timer=setTimeout(()=>advance(trip.step+1),trip.step===3?12000:9000)}
function announce(){msg(guide());say(guide());if(trip?.step===3&&prefs.vibe)navigator.vibrate?.([200,120,200])}
function advance(step){if(!trip)return;note='';trip.step=step;save('trip',trip);render();announce()}
function go(p){page=p;msg('');render();window.scrollTo(0,0)}
const icons={홈:'<path d="m3 10 9-7 9 7v10H3z M9 20v-7h6v7"/>',이동:'<path d="M21 3 3 10l7 4 4 7z M10 14 21 3"/>',도움:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2m0 3h.01"/>','내 정보':'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 5 0 0 1 16 0v2"/>'};
function render(){let html='';$('settings').hidden=page!=='홈';$('settings').style.display=page==='홈'?'grid':'none';$('n').innerHTML=page==='시작'?'':['홈','이동','도움','내 정보'].map(t=>`<button type=button data-action='go:${t}' aria-label='${t}' ${page===t?'aria-current=page':''}><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.85' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>${icons[t]}</svg></button>`).join('');
if(page==='시작')html=card('버스 이동이 한결 편해져요',map+'<p>목적지를 정하면 버스를 기다릴 때부터 내릴 때까지 안내해 드려요.</p><p class=muted>회원가입 없이 바로 체험할 수 있어요.</p>'+action('잇다 시작하기','intro',true));
if(page==='홈')html=(trip?card('이동 이어하기',`<p>${esc(trip.dest)} · ${steps[trip.step]}</p>`+action('이어서 안내받기','resume',true)):'')+card('어디로 가시나요?',`<div class=voice-home><button id=home-mic type=button data-action='mic' aria-label='목적지 음성 검색' aria-pressed=false><svg viewBox='0 0 48 48' fill='none' stroke='currentColor' stroke-width='3.5' stroke-linecap='round' aria-hidden=true><rect x='18' y='6' width='12' height='23' rx='6'/><path d='M12 23a12 12 0 0 0 24 0M24 35v7m-7 0h14'/></svg></button><strong id=voice-label aria-live=polite>음성 검색</strong><p class=muted>마이크를 누르고 목적지를 말해 주세요.</p></div><div class=destination-entry><label for=dest>또는 직접 입력</label><input id=dest maxlength=80 placeholder='예: 춘천시청' value='${esc(draft)}'></div>`+action('목적지 확인','confirm',true))+card('자주 가는 장소',places.map((p,i)=>action(esc(p),'place:'+i)).join('')+action('장소 관리','go:내 정보'))+card('출발 전 확인','<p class=muted>안내를 들을 수 있는지 미리 확인하고, 이동 중 필요한 도움을 찾아보세요.</p>'+action('음성 안내 테스트','soundtest')+action('이동 중 도움 보기','go:도움'));
if(page==='목적지 확인')html=card('이곳으로 갈까요?',`<p><strong>${esc(draft)}</strong></p><p class=muted>실제 노선 조회 없이 예시 상황으로 진행해요.</p>`+(trip?'<p>시작하면 이전 이동을 새 이동으로 바꿔요.</p>':'')+action('네, 이동 안내 시작','start',true)+action('다시 입력','go:홈'));
if(page==='이동')html=trip?card(esc(trip.dest),`<span class=tag>시연 · ${trip.step+1}/5</span><p><strong>${steps[trip.step]}</strong></p>${map}<p class=muted>예시 경로 · 실시간 위치 아님</p><p>${esc(guide())}</p>`+(note?action('대기부터 다시 시작','wait',true)+action('이 단계 계속하기','retry'): [action('버스 도착 장면 보기','next',true),action('네, 탔어요','next',true)+action('아직 안 탔어요','wait')+action('🎙 말로 답하기','board'),action('하차 준비 장면 보기','next',true),action('도착 장면 보기','next',true),action('네, 내렸어요','finish',true)][trip.step])+action('안내 다시 듣기','repeat')+action('홈으로','go:홈')+action('이동 종료','stop'))+card('예상과 다른 상황인가요?', ['버스 지연','버스를 놓침','잘못 탑승','위치 불확실','하차 정류장 통과'].map((x,i)=>action(x,'issue:'+i)).join('')):card('진행 중인 이동이 없어요',action('목적지 정하기','go:홈',true));
if(page==='도움')html=card('지금 상황 물어보기',`<label for=q>이동에 대해 질문해 보세요</label><input id=q placeholder='예: 얼마나 남았어?'>`+action('질문하기','ask')+action('🎙 말로 묻기','askmic')+action('안내 다시 듣기','repeat')+'<p class=muted>현재 시연 단계에 맞춰 답하는 규칙 기반 안내예요.</p>')+card('분실물 메모',`<label for=lost>물건과 기억나는 장소</label><input id=lost maxlength=150>${action('이 기기에 저장','lost')}<p class=muted>분실물 신고가 접수되는 것은 아니에요.</p>${reports.map(x=>`<p>${esc(x)}</p>`).join('')}`)+card('안전 및 긴급 도움','<p>이 앱은 자동 신고하지 않아요. 실제 긴급상황에서는 직접 전화하세요.</p><a href=tel:119>119 구조·구급</a> · <a href=tel:112>112 경찰</a>')+card('사용 방법','<details><summary>음성 입력이 안 돼요</summary><p>브라우저의 마이크 권한을 확인하거나 직접 입력해 주세요.</p></details><details><summary>화면을 잠가도 되나요?</summary><p>이 시연은 화면이 켜진 브라우저에서 사용해 주세요.</p></details>');
if(page==='설정')html=card('안내 설정',settingsFields()+action('음성 안내 테스트','soundtest')+action('홈으로','go:홈'));
if(page==='내 정보')html=card('내 프로필',`<label for=name>이름 또는 별명</label><input id=name maxlength=40 value='${esc(profile)}'>`+action('저장','profile')+'<p class=muted>계정이나 서버 없이 이 브라우저에만 저장해요.</p>')+card('자주 가는 장소 관리',`<label for=newplace>추가할 장소</label><input id=newplace maxlength=80>${action('장소 추가','add')}`+places.map((p,i)=>`<label for=p${i}>장소 ${i+1}</label><input id=p${i} maxlength=80 value='${esc(p)}'>`+action('이름 수정','edit:'+i)+action('삭제','delete:'+i)).join(''))+card('이동 기록과 개인정보',history.map(x=>`<p>${esc(x)}</p>`).join('')||'<p>아직 이동 기록이 없어요.</p>')+card('기기에 저장된 정보',action('이동 기록 지우기','clear')+action('모든 앱 데이터 지우기','reset')+'<p class=muted>음성 인식은 브라우저 서비스가 처리할 수 있어요. GPS는 사용하지 않아요.</p>');
m.innerHTML=html;schedule()}
function settingsFields(){return [['voice','음성 안내'],['vibe','진동 (지원 기기만)'],['auto','시연 장면 자동 진행']].map(([k,t])=>`<label><input class=check type=checkbox data-pref=${k} ${prefs[k]?'checked':''}> ${t}</label>`).join('')}
document.addEventListener('click',e=>{if(!e.target.closest('[data-action="soundtest"]'))return;if(!prefs.voice)return msg('설정에서 음성 안내를 켜 주세요.');if(!('speechSynthesis'in window))return msg('이 브라우저는 음성 안내를 지원하지 않아요.');const sample='잇다 음성 안내 테스트입니다. 이동 중에는 하차 준비를 알려드려요.';msg(sample);say(sample)});
function confirmDest(v){draft=v.trim();if(!draft)return msg('목적지를 입력해 주세요.');go('목적지 확인');say(draft+' 맞으세요?')}
function answer(q){if(!q.trim())return msg('질문을 입력해 주세요.');const a=!trip?'진행 중인 이동이 없어요. 홈에서 목적지를 정해 주세요.':/실시간|GPS|실제|번호/.test(q)?'실시간 위치나 버스 번호는 확인할 수 없어요. 실제 이동 중에는 정류장 안내판이나 차량 표시를 확인해 주세요.':guide();msg(a);say(a)}
m.addEventListener('input',e=>{if(e.target.id==='dest')draft=e.target.value});m.addEventListener('change',e=>{const k=e.target.dataset.pref;if(k){prefs[k]=e.target.checked;save('prefs',prefs);if(k==='voice'&&!prefs.voice)window.speechSynthesis?.cancel();schedule()}});
$('app').addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.action;if(!a)return;const [k,v]=a.split(':');const val=id=>$(id)?.value.trim()||'';
switch(k){case'go':go(v);break;case'intro':save('intro',true);go('홈');break;case'mic':mic(s=>{if(page==='홈')confirmDest(s.slice(0,80))},$('home-mic'));break;case'confirm':confirmDest(val('dest'));break;case'place':confirmDest(places[v]);break;case'demo':confirmDest('춘천시청');break;case'start':trip={dest:draft,step:0};note='';save('trip',trip);go('이동');announce();break;case'resume':go('이동');announce();break;case'next':advance(Math.min(4,trip.step+1));break;case'wait':advance(0);break;case'retry':advance(trip.step);break;case'board':mic(s=>{if(/아니|안 탔|못 탔|아직/.test(s))advance(0);else if(/네|예|탔어요/.test(s))advance(2);else msg('탑승 여부를 확인하지 못했어요. 버튼으로 알려 주세요.')});break;case'repeat':announce();break;case'finish':history.unshift(trip.dest+' · '+new Date().toLocaleDateString('ko-KR'));save('history',history);trip=null;note='';save('trip',null);go('홈');msg('이동 시연을 마쳤어요.');break;case'stop':if(window.confirm('이동을 종료할까요?')){trip=null;note='';save('trip',null);go('홈')}break;case'issue':note=['시연에서 버스가 지연됐어요. 실제 도착 시간은 정류장 안내판을 확인해 주세요.','시연에서 버스를 놓쳤어요. 다음 버스를 기다리는 장면부터 다시 시작할 수 있어요.','실제 이동 중에는 기사님께 방향을 확인하고 안전한 정류장에서 경로를 다시 확인하세요.','현재 위치를 확정할 수 없어요. 정류장 표지나 버스 안내 방송을 확인하세요.','무리해서 내리지 말고 다음 안전한 정류장에서 내린 뒤 경로를 확인하세요.'][v];render();announce();break;case'ask':answer(val('q'));break;case'askmic':mic(answer);break;case'lost':if(val('lost')){reports.unshift(val('lost'));save('reports',reports);render();msg('이 기기에만 메모를 저장했어요.')}break;case'profile':profile=val('name');if(save('profile',profile))msg('별명을 저장했어요.');break;case'add':if(val('newplace')&&!places.includes(val('newplace'))){places.push(val('newplace'));save('places',places);render()}break;case'edit':if(val('p'+v)){places[v]=val('p'+v);save('places',places);render()}break;case'delete':places.splice(Number(v),1);save('places',places);render();break;case'clear':history=[];save('history',history);render();break;case'reset':if(window.confirm('이 기기에 저장된 잇다 정보를 모두 지울까요?')){try{['places','trip','prefs','history','reports','profile','intro'].forEach(k=>localStorage.removeItem('itda.blue.'+k));location.reload()}catch{msg('저장 정보를 지울 수 없어요.')}}break;}});render();</script></html>
